# Owner: hid::brightness::WritableBrightness — the writable brightness range.
id: core-brightness-floor-owner
language: rust
severity: error
message: Bound brightness through BrightnessState::writable / WritableBrightness; do not clamp to the advertised min/max or re-derive the floor.
note: |
  The device advertises a minimum of 0 that resets the MX Creative Keypad.
  The mock agent once clamped to the advertised `min..=max` and applied a
  level the device layer never writes.
files:
  - crates/**/*.rs
ignores:
  - crates/openlogi-core/src/hid/brightness.rs
rule:
  all:
    - any:
        - all:
            - kind: call_expression
            - regex: '\.clamp\(\s*[\w.]*\.min\s*,\s*[\w.]*\.max\s*\)$'
        - all:
            - kind: call_expression
            - regex: '\.min\.max\('
    - inside:
        kind: source_file
        regex: '\b(BrightnessState|WritableBrightness|BrightnessLoad)\b|0x8040'
        stopBy: end
