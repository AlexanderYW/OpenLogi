# Owner: openlogi_device::write::error::classify_channel_error — how a
# transport failure of a write becomes a WriteError.
id: device-channel-error-owner
language: rust
severity: error
message: classify_channel_error() (openlogi-device write/error.rs) maps a ChannelError to a WriteError; call it with the operation instead of matching ChannelError::Timeout here.
note: |
  The raw lighting write and the keypad image write each mapped a raw-report
  ChannelError inline — timeout to RequestTimedOut, anything else to an opaque
  Hidpp string — differing only in the operation. See "Single source of truth"
  in AGENTS.md.
files:
  - crates/openlogi-device/src/write/**/*.rs
ignores:
  - crates/openlogi-device/src/write/error.rs
rule:
  kind: match_arm
  regex: 'ChannelError::Timeout\s*\)?\s*=>\s*WriteError::RequestTimedOut'
