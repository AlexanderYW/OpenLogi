# Owner: openlogi_device::write::error — classify_channel_error decides how a
# transport failure of a write becomes a WriteError, and classify_hidpp_error
# delegates its Channel arm to it.
id: device-channel-error-owner
language: rust
severity: error
message: classify_channel_error() (openlogi-device write/error.rs) maps a ChannelError to a WriteError, and classify_hidpp_error() routes Hidpp20Error::Channel through it; call one of them instead of matching the channel failure here.
note: |
  The raw lighting write and the keypad image write each mapped a raw-report
  ChannelError inline, the RGB-effects path pre-empted classify_hidpp_error
  with its own Channel arms, and classify_hidpp_error itself mapped a timeout
  to an opaque Hidpp string. See "Single source of truth" in AGENTS.md.
files:
  - crates/openlogi-device/src/write/**/*.rs
ignores:
  - crates/openlogi-device/src/write/error.rs
  - crates/**/tests.rs
  - crates/**/tests/**
rule:
  kind: match_arm
  has:
    field: pattern
    regex: '\bChannelError::|\bHidpp20Error::Channel\b'
